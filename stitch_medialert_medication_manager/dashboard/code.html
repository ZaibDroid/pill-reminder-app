<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediAlert - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "primary-fixed-dim": "#6bd8cb",
                      "primary": "#00685f",
                      "on-surface": "#191c1e",
                      "on-secondary-container": "#007432",
                      "tertiary-container": "#da3437",
                      "inverse-primary": "#6bd8cb",
                      "on-primary-fixed-variant": "#005049",
                      "surface-container": "#eceef0",
                      "on-primary-container": "#f4fffc",
                      "error": "#ba1a1a",
                      "surface-container-high": "#e6e8ea",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#f2f4f6",
                      "surface-variant": "#e0e3e5",
                      "inverse-on-surface": "#eff1f3",
                      "inverse-surface": "#2d3133",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#410004",
                      "on-tertiary-container": "#fffbff",
                      "outline-variant": "#bcc9c6",
                      "tertiary-fixed": "#ffdad7",
                      "background": "#f7f9fb",
                      "secondary-container": "#6bff8f",

                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#005321",

                      "on-tertiary": "#ffffff",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",

                      "xl": "0.75rem",
                      "full": "9999px"

              "spacing": {
                      "margin-mobile": "16px",
                      "2xl": "48px",
                      "lg": "24px",
                      "margin-desktop": "64px",
                      "baseline": "4px",
                      "md": "16px",
                      "xl": "32px",
                      "sm": "8px",
                      "gutter": "16px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "headline-sm": [

                      "display-lg": [

              "fontSize": {

                      "headline-md": [

          },
        }

<style>
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm z-40">
<div class="flex justify-between items-center px-margin-mobile py-sm w-full">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined block">medical_services</span>
</button>
<h1 class="font-display-lg text-display-lg font-bold text-primary dark:text-primary-fixed-dim">MediAlert</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined block">emergency</span>
</button>
</div>
</header>
<main class="px-margin-mobile md:px-margin-desktop py-lg max-w-4xl mx-auto space-y-xl">
<!-- Progress Summary -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-md flex items-center justify-between">
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Today's Adherence</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">2 of 4 doses taken</p>
</div>
<div class="relative w-16 h-16">
<svg class="w-full h-full" viewbox="0 0 100 100">
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-secondary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="40" stroke-dasharray="251.2" stroke-dashoffset="125.6" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-label-md text-label-md text-secondary">50%</span>
</div>
</div>
</section>
<!-- Timeline: Morning -->
<section class="space-y-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Morning</h3>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] overflow-hidden border-l-4 border-secondary flex flex-col md:flex-row">
<div class="p-md flex gap-md flex-1">
<div class="w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container">medication</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<div>
<h4 class="font-headline-sm text-headline-sm text-on-surface">Amoxicillin 500mg</h4>
<span class="inline-block bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-sm mt-xs">Prescription</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">08:00 AM</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Take 1 pill after meal</p>
</div>
</div>
<div class="bg-surface p-sm flex items-center justify-end gap-sm md:flex-col md:w-32 md:justify-center border-t md:border-t-0 md:border-l border-surface-variant">
<span class="font-label-md text-label-md text-secondary flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                        Taken
                    </span>
</div>
</div>
</section>
<!-- Timeline: Afternoon -->
<section class="space-y-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">partly_cloudy_day</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Afternoon</h3>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.1)] overflow-hidden border-l-4 border-primary relative">
<div class="absolute top-2 right-2 bg-error text-on-error font-label-sm text-label-sm px-2 py-0.5 rounded-full">Urgent</div>
<div class="p-md flex gap-md flex-1">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-primary-container">prescriptions</span>
</div>
<div class="flex-1 pr-12">
<div class="flex justify-between items-start">
<div>
<h4 class="font-headline-sm text-headline-sm text-on-surface">Lisinopril 10mg</h4>
<span class="inline-block bg-primary/10 text-primary font-label-sm text-label-sm px-2 py-1 rounded-sm mt-xs">Blood Pressure</span>
</div>
<span class="font-label-md text-label-md text-primary font-bold">01:00 PM</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Take 1 pill with water</p>
</div>
</div>
<div class="p-sm flex gap-sm border-t border-surface-variant bg-surface">
<button class="flex-1 bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md text-label-md py-3 rounded-lg transition-colors">Skip</button>
<button class="flex-[2] bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md py-3 rounded-lg transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">task_alt</span>
                        Take Dose
                    </button>
</div>
</div>
</section>
</main>
<!-- FAB -->
<button class="fixed bottom-[88px] right-margin-mobile md:right-margin-desktop w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:bg-primary/90 transition-transform active:scale-95 z-40">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
<div class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]">
<!-- Active: Dashboard -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 duration-150 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all px-5 py-1 rounded-lg active:scale-90 duration-150 ease-out">
<span class="material-symbols-outlined">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all px-5 py-1 rounded-lg active:scale-90 duration-150 ease-out">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-sm text-label-sm mt-1">Reports</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all px-5 py-1 rounded-lg active:scale-90 duration-150 ease-out">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</div>
</nav>
</body></html>
