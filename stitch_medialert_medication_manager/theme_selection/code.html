<style>
        /* Custom radio button styles to match brand colors */
        input[type='radio']:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
            border-color: #00685f; /* primary color */
            background-color: #00685f;
        }
        
        .theme-card-selected {
            border: 2px solid #00685f;
            background-color: #f4fffc; /* on-primary-container */
        }
        
        .dark .theme-card-selected {
             background-color: #005049; /* on-primary-fixed-variant approximation for dark mode */
        }

<style>
    body {

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Modified for Sub-page: Back button instead of menu) -->
<header class="bg-surface shadow-sm sticky top-0 z-40">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-sm h-16">
<button class="text-primary hover:bg-surface-container-low active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="sr-only">Go back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface flex-1 text-center">App Theme</h1>
<div class="w-10 h-10"></div> <!-- Spacer to balance flex layout -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile md:px-margin-desktop py-lg max-w-3xl mx-auto w-full">
<!-- Header Text -->
<section class="mb-lg">
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                Choose how MediAlert appears on your device. Dark mode can help reduce eye strain in low-light conditions.
            </p>
</section>
<!-- Theme Selection Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-md mb-xl">
<!-- Light Mode Option -->
<label class="cursor-pointer group">
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(0,0,0,0.05)] h-full flex flex-col transition-all duration-200 theme-card-selected relative overflow-hidden">
<div class="flex items-center justify-between mb-md z-10">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">light_mode</span>
<span class="font-label-md text-label-md text-on-surface">Light Mode</span>
</div>
<input checked="" class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-lowest cursor-pointer" name="app-theme" type="radio" value="light"/>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mb-md flex-1 z-10">
                        Clean, high-contrast clinical look.
                    </p>
<!-- Mini Preview -->
<div class="bg-surface-container-low rounded-lg p-sm border border-outline-variant/30 mt-auto opacity-80 group-hover:opacity-100 transition-opacity pointer-events-none select-none z-10">
<div class="flex items-center gap-xs mb-xs">
<div class="w-4 h-4 rounded-full bg-primary flex-shrink-0"></div>
<div class="h-2 w-16 bg-outline-variant rounded"></div>
</div>
<div class="h-8 bg-surface-container-lowest rounded-md shadow-sm border border-surface-variant flex items-center px-xs">
<div class="h-1.5 w-1/2 bg-surface-dim rounded"></div>
</div>
</div>
</div>
</label>
<!-- Dark Mode Option -->
<label class="cursor-pointer group">
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-transparent hover:border-primary/30 h-full flex flex-col transition-all duration-200 relative overflow-hidden">
<div class="flex items-center justify-between mb-md z-10">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">dark_mode</span>
<span class="font-label-md text-label-md text-on-surface">Dark Mode</span>
</div>
<input class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-lowest cursor-pointer" name="app-theme" type="radio" value="dark"/>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mb-md flex-1 z-10">
                        Deep teal and dark gray palette for night use.
                    </p>
<!-- Mini Preview (Dark) -->
<div class="bg-[#191c1e] rounded-lg p-sm border border-[#3d4947] mt-auto opacity-70 group-hover:opacity-100 transition-opacity pointer-events-none select-none z-10">
<div class="flex items-center gap-xs mb-xs">
<div class="w-4 h-4 rounded-full bg-[#89f5e7] flex-shrink-0"></div> <!-- primary-fixed approximate -->
<div class="h-2 w-16 bg-[#6d7a77] rounded"></div>
</div>
<div class="h-8 bg-[#2d3133] rounded-md shadow-sm border border-[#3d4947] flex items-center px-xs">
<div class="h-1.5 w-1/2 bg-[#3d4947] rounded"></div>
</div>
</div>
</div>

<div class="flex items-center justify-between mb-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">settings_brightness</span>
<span class="font-label-md text-label-md text-on-surface">System Default</span>
</div>
<input class="w-5 h-5 text-primary focus:ring-primary border-outline-variant bg-surface-container-lowest cursor-pointer" name="app-theme" type="radio" value="system"/>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mb-md flex-1">
                        Automatically matches your device settings.
                    </p>
<div class="h-[74px] flex items-center justify-center bg-surface-container-low rounded-lg mt-auto text-on-surface-variant">
<span class="material-symbols-outlined text-[32px] opacity-50">smartphone</span>
</div>
</div>
</label>
</section>
</main>
<!-- Javascript for simple interactions (Optional based on requirements, but adds to "UI designer" feel) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="app-theme"]');
            
            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Remove selected class from all cards
                    document.querySelectorAll('input[name="app-theme"]').forEach(r => {
                        const card = r.closest('.rounded-xl');
                        card.classList.remove('theme-card-selected');
                        card.classList.remove('border-transparent');
                        card.classList.add('border-transparent'); // reset
                        
                        // Update icon styling for unselected
                        const icon = card.querySelector('.material-symbols-outlined');
                        if(icon && r.value !== 'system') {
                             icon.style.fontVariationSettings = "'FILL' 0";
                             icon.classList.remove('text-primary');
                             icon.classList.add('text-on-surface-variant');
                        }
                    });

                    // Add selected class to chosen card
                    if (e.target.checked) {
                        const selectedCard = e.target.closest('.rounded-xl');
                        selectedCard.classList.remove('border-transparent');
                        selectedCard.classList.add('theme-card-selected');
                        
                        // Update icon styling for selected
                        const icon = selectedCard.querySelector('.material-symbols-outlined');
                        if(icon) {
                             icon.style.fontVariationSettings = "'FILL' 1";
                             icon.classList.remove('text-on-surface-variant');
                             icon.classList.add('text-primary');
                        }
                    }
                });
            });
        });
    </script>
</body></html>
