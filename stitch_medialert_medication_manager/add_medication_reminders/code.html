<h2 class="font-headline-md text-headline-md text-on-surface mb-lg">Duration &amp; Reminders</h2>

<!-- Duration Section -->

<h3 class="font-headline-sm text-headline-sm text-primary mb-md flex items-center gap-2">

                </h3>

<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer transition-transform duration-200 ease-in-out peer checked:translate-x-6 checked:border-primary" id="ongoing-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer peer-checked:bg-primary-container transition-colors duration-200 ease-in-out" for="ongoing-toggle"></label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Start Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg p-3 font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" type="date" value="2023-10-27"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">End Date</label>
<div class="relative">

</div>
</div>
</div>

<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer peer-checked:bg-tertiary-container transition-colors duration-200 ease-in-out" for="priority-toggle"></label>

<option>Gentle Beep</option>

<script>
        // Simple logic to disable end date when 'ongoing' is checked
        const ongoingToggle = document.getElementById('ongoing-toggle');
        const endDateInput = document.querySelector('input[type="date"]:last-of-type');

        ongoingToggle.addEventListener('change', function() {
            endDateInput.disabled = this.checked;
        });
    </script>
