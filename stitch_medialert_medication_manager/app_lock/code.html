<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediAlert - Security Lock</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#e6e8ea",
                      "on-tertiary": "#ffffff",
                      "on-secondary-container": "#007432",
                      "on-secondary-fixed-variant": "#005321",
                      "error": "#ba1a1a",
                      "outline": "#6d7a77",
                      "primary-container": "#008378",
                      "on-surface": "#191c1e",
                      "inverse-on-surface": "#eff1f3",
                      "error-container": "#ffdad6",
                      "primary": "#00685f",
                      "on-background": "#191c1e",
                      "secondary": "#006e2f",
                      "secondary-fixed-dim": "#4ae176",
                      "primary-fixed-dim": "#6bd8cb",
                      "inverse-primary": "#6bd8cb",
                      "on-primary-fixed-variant": "#005049",
                      "surface-container": "#eceef0",
                      "tertiary-fixed": "#ffdad7",
                      "primary-fixed": "#89f5e7",
                      "tertiary": "#b61722",
                      "outline-variant": "#bcc9c6",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#410004",
                      "on-secondary-fixed": "#002109",
                      "on-primary-container": "#f4fffc",
                      "tertiary-fixed-dim": "#ffb3ad",
                      "secondary-container": "#6bff8f",
                      "surface-dim": "#d8dadc",
                      "surface-variant": "#e0e3e5",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#2d3133",
                      "surface-container-lowest": "#ffffff",
                      "surface-tint": "#006a61",
                      "on-secondary": "#ffffff",
                      "surface-container-highest": "#e0e3e5",
                      "tertiary-container": "#da3437",
                      "surface-container-low": "#f2f4f6",
                      "on-primary-fixed": "#00201d",
                      "surface": "#f7f9fb",
                      "on-surface-variant": "#3d4947",
                      "background": "#f7f9fb",
                      "surface-bright": "#f7f9fb",
                      "secondary-fixed": "#6bff8f",
                      "on-tertiary-container": "#fffbff",
                      "on-tertiary-fixed-variant": "#930013",
                      "on-error": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "xs": "4px",
                      "baseline": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "margin-desktop": "64px",
                      "2xl": "48px",
                      "lg": "24px",
                      "gutter": "16px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-sm": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<main class="min-h-screen w-full flex flex-col items-center justify-between py-12 px-margin-mobile">
<!-- Header / Logo Area -->
<header class="flex flex-col items-center gap-4 mt-8 animate-[fadeIn_0.5s_ease-out]">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-display-lg text-primary" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="font-display-lg text-display-lg font-bold text-primary tracking-tight">MediAlert</h1>
</header>
<!-- PIN Prompt & Dots -->
<section class="flex flex-col items-center gap-8 w-full max-w-sm mt-8 animate-[slideUp_0.5s_ease-out_0.1s_both]">
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant text-center">Enter PIN to Unlock</h2>
<div aria-label="PIN Entry Status" class="flex gap-6 justify-center">
<div class="w-4 h-4 rounded-full bg-primary shadow-sm transition-all duration-300 transform scale-110"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-highest transition-all duration-300"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-highest transition-all duration-300"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-highest transition-all duration-300"></div>
</div>
</section>
<!-- Numeric Keypad -->
<section class="w-full max-w-sm flex flex-col gap-6 mb-4 animate-[slideUp_0.5s_ease-out_0.2s_both]">
<div class="grid grid-cols-3 gap-y-6 gap-x-6 place-items-center">
<!-- Row 1 -->
<button aria-label="1" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">1</button>
<button aria-label="2" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">2</button>
<button aria-label="3" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">3</button>
<!-- Row 2 -->
<button aria-label="4" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">4</button>
<button aria-label="5" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">5</button>
<button aria-label="6" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">6</button>
<!-- Row 3 -->
<button aria-label="7" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">7</button>
<button aria-label="8" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">8</button>
<button aria-label="9" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">9</button>
<!-- Row 4 -->
<button aria-label="Use Biometrics" class="w-20 h-20 rounded-full flex items-center justify-center text-primary bg-transparent hover:bg-surface-container-lowest active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">
<span class="material-symbols-outlined text-display-lg">fingerprint</span>
</button>
<button aria-label="0" class="w-20 h-20 rounded-full flex items-center justify-center font-display-lg text-display-lg text-on-surface bg-surface-container-low hover:bg-surface-container active:bg-surface-container-high shadow-sm active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">0</button>
<button aria-label="Delete" class="w-20 h-20 rounded-full flex items-center justify-center text-on-surface-variant bg-transparent hover:bg-surface-container-lowest active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary-container">
<span class="material-symbols-outlined text-display-lg">backspace</span>
</button>
</div>
<!-- Auxiliary Actions -->
<div class="mt-8 flex justify-center">
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors py-4 px-6 rounded-full hover:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container">
                    Forgot PIN?
                </button>
</div>
</section>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
