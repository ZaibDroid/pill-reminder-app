<body class="bg-background text-on-background h-full font-body-md text-body-md flex flex-col items-center">
<!-- Top App Bar (Task focused, so standard nav is suppressed. Using a simple header for this flow) -->
<header class="w-full top-0 sticky bg-surface shadow-sm flex justify-between items-center px-margin-mobile py-sm z-50">
<button class="text-primary hover:bg-surface-container-high rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-headline-sm text-headline-sm text-primary text-center flex-grow">Add Medication</div>
<div class="w-10"></div> <!-- Spacer to balance flex layout -->
</header>
<main class="w-full max-w-md mx-auto px-margin-mobile py-lg flex-grow flex flex-col gap-lg">
<!-- Progress Indicator -->
<div class="flex items-center justify-between gap-sm mb-sm">
<div class="h-2 flex-grow bg-primary rounded-full"></div>
<div class="h-2 flex-grow bg-surface-variant rounded-full"></div>
<div class="h-2 flex-grow bg-surface-variant rounded-full"></div>
<div class="h-2 flex-grow bg-surface-variant rounded-full"></div>
</div>
<div class="font-label-md text-label-md text-on-surface-variant text-center mb-md">Step 1 of 4: Basic Info</div>
<!-- Add Photo Button / Image Placeholder -->
<div class="w-full aspect-video rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-highest transition-colors relative overflow-hidden group">
<div class="z-10 flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
<span class="font-label-md text-label-md text-primary">Add Pill Photo</span>
</div>
<!-- Optional image preview layer could go here -->
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-lg mt-md">
<!-- Medicine Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="med-name">Medicine Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">medication</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.05)] h-[56px] transition-all outline-none" id="med-name" placeholder="e.g., Amoxicillin" type="text"/>
</div>
</div>
<!-- Dosage Field Group -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="dosage-amount">Dosage</label>
<div class="flex gap-sm">
<div class="relative flex-grow">
<input class="w-full px-4 py-4 rounded-xl bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.05)] h-[56px] transition-all outline-none" id="dosage-amount" placeholder="Amount" type="number"/>
</div>
<div class="relative w-1/3 min-w-[100px]">
<select class="w-full appearance-none px-4 py-4 pr-10 rounded-xl bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.05)] h-[56px] transition-all outline-none cursor-pointer" id="dosage-unit">
<option value="mg">mg</option>
<option value="ml">ml</option>
<option value="tablet">Tablet(s)</option>
<option value="capsule">Capsule(s)</option>
<option value="drops">Drop(s)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
</form>
<!-- Bottom Spacing for fixed button -->
<div class="pb-[100px]"></div>
</main>
<!-- Bottom Fixed Action Button -->
<div class="fixed bottom-0 w-full max-w-md mx-auto p-margin-mobile bg-gradient-to-t from-background to-transparent pointer-events-none flex justify-center items-end">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md rounded-full h-[56px] flex items-center justify-center gap-xs pointer-events-auto shadow-[0px_4px_20px_rgba(0,0,0,0.1)] transition-all active:scale-95">
<span>Next Step</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
