<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>

<!-- Script to handle simple UI interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Radio button selection visual update
            const formatRadios = document.querySelectorAll('input[name="format"]');
            formatRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all
                    document.querySelectorAll('input[name="format"]').forEach(r => {
                        const parent = r.closest('label');
                        parent.className = "flex flex-col items-center justify-center p-md rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer min-h-[80px] transition-all grayscale opacity-70";
                        const icon = parent.querySelector('.material-symbols-outlined');
                        icon.classList.remove('icon-filled', 'text-primary');
                        icon.classList.add('text-on-surface-variant');
                        const text = parent.querySelector('span.font-label-md');
                        text.classList.remove('text-primary');
                        text.classList.add('text-on-surface-variant');
                        
                        const checkmark = parent.querySelector('.absolute');
                        if(checkmark) checkmark.remove();
                    });

                    // Set active
                    const parent = e.target.closest('label');
                    parent.className = "flex flex-col items-center justify-center p-md rounded-xl border-2 border-primary bg-primary-container bg-opacity-10 cursor-pointer min-h-[80px] relative transition-all";
                    const icon = parent.querySelector('.material-symbols-outlined');
                    icon.classList.add('icon-filled', 'text-primary');
                    icon.classList.remove('text-on-surface-variant');
                    const text = parent.querySelector('span.font-label-md');
                    text.classList.add('text-primary');
                    text.classList.remove('text-on-surface-variant');
                    
                    // Add checkmark
                    const check = document.createElement('span');
                    check.className = "absolute top-2 right-2 material-symbols-outlined text-primary text-[18px]";
                    check.textContent = "check_circle";
                    parent.appendChild(check);
                });
            });

            // Date Range chips
            const dateChips = document.querySelectorAll('.hide-scrollbar button');
            dateChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Reset all
                    dateChips.forEach(c => {
                        c.className = "whitespace-nowrap px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low font-label-sm text-label-sm transition-colors";
                    });
                    // Set active
                    chip.className = "whitespace-nowrap px-4 py-2 rounded-full border border-primary bg-primary-container text-on-primary-container font-label-sm text-label-sm transition-colors";
                });
            });
        });
    </script>
